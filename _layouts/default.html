<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: "MAGIC Gamma Telescope — ABK Team" }}</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        max-width: 920px;
        margin: 2rem auto;
        padding: 0 1.2rem 4rem;
        line-height: 1.6;
        color: #24292f;
      }
      h1, h2, h3, h4 { line-height: 1.25; margin-top: 1.8em; margin-bottom: 0.6em; }
      h1 { font-size: 1.9rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.3em; }
      h2 { font-size: 1.4rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.3em; }
      h3 { font-size: 1.15rem; }
      p, ul, ol, blockquote, table { margin: 0.8em 0; }
      a { color: #0969da; }
      blockquote {
        border-left: 4px solid #d0d7de;
        padding: 0 1em;
        color: #57606a;
      }
      pre, code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.88em;
      }
      code {
        background: #eff1f3;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      pre {
        background: #f6f8fa;
        padding: 1rem;
        overflow-x: auto;
        border-radius: 6px;
      }
      pre code { background: none; padding: 0; }
      table { border-collapse: collapse; display: block; overflow-x: auto; }
      th, td { border: 1px solid #d0d7de; padding: 0.45em 0.8em; }
      th { background: #f6f8fa; }
      img { max-width: 100%; }
      .mermaid {
        background: #fff;
        text-align: center;
        margin: 1.2rem 0;
        overflow-x: auto;
      }
      nav.site-nav {
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid #d0d7de;
      }
      nav.site-nav a { margin-right: 1.2rem; }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <a href="https://amrskk.github.io/">amrskk</a>
      <a href="https://amrskk.github.io/svm-under-the-hood/">SVM — Under the Hood</a>
      <a href="https://amrskk.github.io/mlfinal/">MAGIC Telescope Project</a>
      <a href="https://amrskk.github.io/umap.html">UMAP notes</a>
    </nav>

    <article>{{ content }}</article>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
      // Kramdown+rouge wraps fenced ```mermaid blocks as
      //   <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre><code>...</code></pre></div></div>
      // Without rouge, the class lands on <code> directly. Handle both.
      document
        .querySelectorAll("div.language-mermaid, pre > code.language-mermaid")
        .forEach((el) => {
          const isCode = el.tagName === "CODE";
          const codeEl = isCode ? el : el.querySelector("code") || el;
          const target = isCode ? el.closest("pre") || el : el;
          const div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = codeEl.textContent;
          target.replaceWith(div);
        });
      mermaid.initialize({
        startOnLoad: false,
        theme: "default",
        securityLevel: "loose",
      });
      await mermaid.run({ querySelector: ".mermaid" });
    </script>
  </body>
</html>
